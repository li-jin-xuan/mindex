name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q tools tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Verify generated index
        run: python tools/verify.py
      - name: Validate plugin manifest
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: |
          npx -y @anthropic-ai/claude-code@2.1.158 plugin validate --strict plugin
          npx -y @anthropic-ai/claude-code@2.1.158 plugin validate --strict .
